# TEMPORARY CI for PR #4 (Matrix Spaces hierarchy).
# Delete this workflow before or immediately after the PR is merged.
name: Temporary Matrix Spaces Tests

on:
  push:
    branches:
      - feat/matrix-space-hierarchy-20261011
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/matrix-spaces-temp-tests.yml
      - packages/platform-matrix/**
      - packages/bridge/src/dialogs.ts
      - packages/bridge/src/conversation-kinds.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-spaces-temp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - typecheck
          - unit-and-bridge
          - matrix-http-e2e
    env:
      HUSKY: '0'
      YARN_ENABLE_SCRIPTS: 'true'

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Yarn via Corepack
        run: corepack enable

      - name: Install dependencies (lockfile enforced)
        run: yarn install --immutable

      - name: Type-check repository and tests
        if: matrix.suite == 'typecheck'
        run: yarn typecheck

      - name: Matrix hierarchy and bridge regression unit tests
        if: matrix.suite == 'unit-and-bridge'
        run: >-
          yarn vitest run --config vitest.config.mts
          packages/platform-matrix/src
          packages/bridge/src/conversation-kinds.test.ts
          --maxWorkers=2

      - name: Matrix real HTTP transport e2e
        if: matrix.suite == 'matrix-http-e2e'
        run: >-
          yarn vitest run --config vitest.mtproto-e2e.config.mts
          packages/platform-matrix/src/e2e.test.ts
          --maxWorkers=1
