name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      HUSKY: 0

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: true

      - name: Run full unit tests (POSIX)
        if: matrix.os != 'windows-latest'
        run: yarn test:unit

      # Telegram Gateway and Telegram session storage intentionally enforce
      # POSIX 0700/0600 semantics. NTFS ACLs cannot be validated via stat.mode,
      # so Windows runs every other suite; Linux still covers those secure stores.
      - name: Run platform-neutral unit tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          yarn vitest run --exclude=packages/telegram-gateway/src/gateway.test.ts --exclude=packages/telegram-gateway/src/store.test.ts --exclude=packages/platform-telegram/src/index.test.ts
          yarn test:webui:solid '--exclude=**/*.e2e.test.ts'
          yarn test:unit:node

      - name: Check TypeScript types
        run: yarn typecheck

      - name: Account-sharded SQLite migration and batch E2E (POSIX)
        if: matrix.os != 'windows-latest'
        run: yarn vitest run --config vitest.mtproto-e2e.config.mts packages/update-store-database/src/sharded-sqlite.e2e.test.ts --maxWorkers=1

  webui:
    name: WebUI browser e2e
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn typecheck:webui
      - run: yarn test:e2e:webui
      - name: Run on-demand Telegram login e2e
        run: yarn vitest run --config vitest.mtproto-e2e.config.mts packages/test-suite/src/login.e2e.test.ts -t 'issues a code on Telegram request, displays it in management and consumes it once' --maxWorkers=1
