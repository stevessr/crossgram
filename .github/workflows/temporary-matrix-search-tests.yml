# Temporary PR #1 validation workflow. Remove once Matrix search is merged.
name: Temporary Matrix Search Tests

on:
  push:
    branches:
      - feat/matrix-message-search
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-matrix-search-tests.yml'
      - 'packages/platform-matrix/**'
      - 'packages/bridge/src/dialogs.ts'
      - 'packages/bridge/src/dialogs.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-matrix-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-search:
    name: Matrix search and bridge regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: true

      - name: Test Matrix adapter and search
        run: yarn workspace @mtproto-relay/platform-matrix test

      - name: Test Telegram bridge search regressions
        run: yarn vitest run --config vitest.config.mts packages/bridge/src/dialogs.test.ts

      - name: Type-check complete workspace
        run: yarn typecheck
