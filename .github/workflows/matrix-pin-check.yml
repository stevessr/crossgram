# Temporary PR #7 validation workflow: remove before merging.
name: Matrix pin integration (temporary)

on:
  push:
    branches:
      - feat/matrix-pins-room-notifications
  workflow_dispatch:

concurrency:
  group: matrix-pin-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Matrix pin integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Test Matrix and Telegram pin bridge
        run: >-
          yarn vitest run
          packages/platform-matrix/src/client.test.ts
          packages/platform-matrix/src/platform.test.ts
          packages/platform-matrix/src/formatting.test.ts
          packages/platform-matrix/src/search.test.ts
          packages/bridge/src/conversation-kinds.test.ts
          packages/bridge/src/update-manager.test.ts
          packages/bridge/src/notification-settings.e2e.test.ts
      - name: Type-check repository
        run: yarn typecheck
