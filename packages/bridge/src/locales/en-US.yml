dcId: Telegram data-center ID advertised by the bridge.
serverHost: Public MTProto host advertised to Telegram clients.
serverPort: Public MTProto port advertised to Telegram clients.
altEndpoints: Alternate MTProto endpoints for the same data center, as host:port or [IPv6]:port strings, advertised after the primary endpoint.
publicWsEndpoint: Public WSS front for the WebSocket transport (e.g. wss://mt.example.org/mtproto behind Cloudflare). Shown in the WebUI server config; empty advertises TCP only.
apiPrefix: HTTP prefix used for platform account assets.
onDemandLoginCodes: Issue login codes only on Telegram or WebUI requests instead of continuously rotating TOTP codes (recommended).
groupFilesMiniApp: Telegram attachment-menu Mini App used to browse platform-native group files.
uploadPath: Directory used to store uploads received from Telegram clients.
autoMuteGroupChats: Mute group chats by default; per-chat Telegram settings can override this.
officialStickerBotToken: "Telegram Bot token; when set, requests for official sticker sets resolve live through the Bot API."
officialStickerApiBase: Base URL of the Telegram Bot API server used for official stickers.
blockedContentMode: "Blocked-user visibility: show keeps Telegram's default group behavior; hide-user hides their messages and reactions; hide-related also hides messages replying to or mentioning them."
recalledMessageMode: "QQ recalled-message visibility: show keeps the message with a recalled marker; hide removes it from visible history."
voiceWorkerSocketPath: Local Unix socket path for the Rust voice worker; leave empty to disable voice calls.
voiceWorkerTimeoutMs: Maximum time in milliseconds for one local voice-worker request.
voiceDirectIce: Allow direct ICE only when the configured MTProto host is loopback or private LAN.
voiceTurnHost: Public TURN host advertised to Telegram and the native voice worker; leave empty to disable TURN.
voiceTurnPort: Public TURN port advertised to Telegram and the native voice worker.
voiceTurnSharedSecret: Coturn REST-auth shared secret used only to derive call-scoped credentials.
voiceTurnTtlSeconds: Lifetime in seconds for derived call-scoped TURN credentials.

lazySync: Lazily pause platform subscriptions while no Telegram client is active. Idle accounts reopen one bounded sync window every idle interval.
lazySync.enabled: Enable the idle reaper.
lazySync.activeWindowMs: A session with a client RPC inside this window keeps its subscription running.
lazySync.idleSyncIntervalMs: How often an idle account performs one bounded lazy sync.
lazySync.idleSyncDurationMs: How long one lazy sync keeps the subscription open.
