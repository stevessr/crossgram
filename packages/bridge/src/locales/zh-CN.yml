dcId: 网桥向 Telegram 客户端公布的数据中心 ID。
serverHost: 向 Telegram 客户端公布的 MTProto 主机地址。
serverPort: 向 Telegram 客户端公布的 MTProto 主端口。
altEndpoints: 在同一数据中心中、紧随主地址向 Telegram 客户端公布的备用 MTProto 地址，格式为 host:port 或 [IPv6]:port。
publicWsEndpoint: 客户端 WebSocket 传输的公网入口（如 wss://mt.example.org/mtproto，可经 Cloudflare 等代理）；留空则仅公布 TCP 地址。显示在 WebUI 服务器配置里。
apiPrefix: 平台账户资源使用的 HTTP 路径前缀。
onDemandLoginCodes: 按需签发验证码（推荐）：仅在 Telegram 客户端或 WebUI 发起请求时生成，不再自动轮换。
groupFilesMiniApp: 用于浏览平台原生群文件的 Telegram 附件菜单小程序。
uploadPath: 用于存储 Telegram 客户端上传文件的目录。
autoMuteGroupChats: 默认关闭群聊通知；可在 Telegram 中为单个群聊单独开启。
officialStickerBotToken: Telegram Bot token；配置后官方贴纸集请求会通过 Bot API 实时解析。
officialStickerApiBase: 官方贴纸使用的 Telegram Bot API 服务地址。
blockedContentMode: 拉黑用户内容显示策略：show 保留 Telegram 默认群聊显示；hide-user 隐藏其消息和 reaction；hide-related 还会隐藏回复或 @ 该用户的消息。
recalledMessageMode: QQ 撤回消息显示策略：show 保留消息并标记为已撤回；hide 直接隐藏消息。
voiceWorkerSocketPath: Rust 语音工作进程的本地 Unix socket 路径；留空以禁用语音通话。
voiceWorkerTimeoutMs: 单次本地语音工作进程请求允许的最长毫秒数。
voiceDirectIce: 仅当配置的 MTProto 主机为回环地址或私有 LAN 时允许直接 ICE。
voiceTurnHost: 向 Telegram 和原生语音工作进程公布的 TURN 主机；留空以禁用 TURN。
voiceTurnPort: 向 Telegram 和原生语音工作进程公布的 TURN 端口。
voiceTurnSharedSecret: Coturn REST 认证共享密钥，仅用于派生单次通话凭据。
voiceTurnTtlSeconds: 派生的单次通话 TURN 凭据有效期（秒）。

lazySync: 没有 Telegram 客户端活跃时懒暂停平台订阅。空闲账号每隔一个懒同步周期重新打开一段有界同步窗口。
lazySync.enabled: 是否启用空闲回收器。
lazySync.activeWindowMs: 会话在该窗口内有客户端 RPC 时保持订阅运行。
lazySync.idleSyncIntervalMs: 空闲账号执行一次有界懒同步的周期。
lazySync.idleSyncDurationMs: 一次懒同步保持订阅打开的时长。
