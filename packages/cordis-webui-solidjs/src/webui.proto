syntax = "proto3";
package crossgram.webui.v2;

// Dynamic extension data uses native typed protobuf fields, never JSON text.
// Field numbers match google.protobuf.Value/Struct/ListValue.
message Value {
  oneof kind {
    NullValue null_value = 1;
    double number_value = 2;
    string string_value = 3;
    bool bool_value = 4;
    Struct struct_value = 5;
    ListValue list_value = 6;
  }
}
enum NullValue { NULL_VALUE = 0; }
message Struct { map<string, Value> fields = 1; }
message ListValue { repeated Value values = 1; }

message Frame {
  enum Kind {
    UNSPECIFIED = 0;
    ENTRY_INIT = 1;
    ENTRY_SNAPSHOT = 2;
    ENTRY_DELTA = 3;
    ENTRY_MISSING = 4;
    RPC_REQUEST = 5;
    RPC_RESPONSE = 6;
    ENTRY_SUBSCRIBE = 7;
    ENTRY_UNSUBSCRIBE = 8;
    PING = 9;
    PONG = 10;
    RPC_START = 11;
    RPC_DELTA = 12;
    RPC_COMPLETE = 13;
    RPC_ERROR = 14;
    RPC_CANCEL = 15;
  }
  Kind kind = 1;
  // Serialized Value; gzip-compressed iff gzip is true. Empty means no body.
  bytes protobuf_payload = 2;
  bool gzip = 3;
}
